# Replaces the Rabbit Holes site with redirects. Same Worker name and routes as the
# old site (bebhuvan/rabbit-holes, wrangler.toml), so deploying this takes over
# rabbitholes.garden and www.rabbitholes.garden, plus the retired Paper Trails and
# Book Trails subdomains. Their old Workers/Pages projects must be deleted first, or
# the routes below will clash with theirs.
name = "rabbit-holes"
main = "worker.js"
compatibility_date = "2024-12-19"
workers_dev = false

routes = [
  { pattern = "rabbitholes.garden/*", zone_name = "rabbitholes.garden" },
  { pattern = "www.rabbitholes.garden/*", zone_name = "rabbitholes.garden" },
  { pattern = "papertrails.rabbitholes.garden/*", zone_name = "rabbitholes.garden" },
  { pattern = "booktrails.rabbitholes.garden/*", zone_name = "rabbitholes.garden" }
]
